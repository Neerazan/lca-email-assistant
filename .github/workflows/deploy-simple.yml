name: Simple Deploy (Git Pull)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'DEPLOYMENT_GUIDE.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            #!/bin/bash
            set -e
            
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            APP_NAME="lca-email-assistant"
            
            echo "========================================="
            echo "🚀 Simple Git Pull Deployment"
            echo "========================================="
            
            cd "$DEPLOY_PATH"
            
            # Stop app
            echo "⏹️  Stopping application..."
            pm2 stop "$APP_NAME" 2>/dev/null || true
            
            # Pull latest code
            echo "📥 Pulling latest code from Git..."
            git pull origin main
            
            # Install dependencies
            echo "📦 Installing dependencies..."
            npm ci --omit=dev --legacy-peer-deps 2>&1 | grep -E "^(added|removed|up to date)" | tail -1
            
            # Build
            echo "🔨 Building application..."
            npm run build
            
            # Start app
            echo "🚀 Starting application..."
            pm2 start "$APP_NAME" || pm2 restart "$APP_NAME"
            pm2 save
            
            sleep 2
            
            echo "✅ Deployment completed!"
            pm2 logs "$APP_NAME" --lines 5 --nostream
